name: Zaynix iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: XcodeGen Generate
        run: |
          xcodegen generate

      - name: Xcode Build Archive
        run: |
          xcodebuild \
            -project ZaynixFile.xcodeproj \
            -scheme ZaynixFile \
            -sdk iphoneos \
            -configuration Release \
            archive
            
