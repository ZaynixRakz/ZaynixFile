name: ZaynixFile

options:
  bundleIdPrefix: com.zaynix
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ZaynixFile:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ios/ZaynixFile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaynix.file
        INFOPLIST_KEY_CFBundleDisplayName: Zaynix File
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "26.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: ios/ZaynixFile/Info.plist
      
