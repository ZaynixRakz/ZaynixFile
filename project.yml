name: ZaynixFile
options:
  bundleIdPrefix: com.zaynix
targets:
  ZaynixFile:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ios/ZaynixFile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaynix.file
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: "26.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        
