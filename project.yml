name: ZaynixFile

options:
  bundleIdPrefix: com.zaynix
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:

  ZaynixFile:

    type: application

    platform: iOS

    deploymentTarget: "26.0"

    sources:
      - path: ios/ZaynixFile

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaynix.file
        INFOPLIST_KEY_CFBundleDisplayName: Zaynix File
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

    info:
      path: ios/ZaynixFile/Info.plist
